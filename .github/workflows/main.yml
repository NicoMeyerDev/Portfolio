name: CI/CD Workflow
on:
  push:
    branches:
      - main
      # TODO: remove once project-setup is merged into main
      - project-setup
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  pages: write # to deploy to Pages
  id-token: write

jobs:
  build-and-deploy-to-pages:
    name: Build website and deploy to GitHub Pages
    uses: ./.github/workflows/deploy.yaml